# Deploy SeaweedFS (S3-compatible object storage), does not require an operator.
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
---
# Example secret, copy to client namespace.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
  namespace: seaweedfs
stringData:
  access_key_id: loki-user
  access_key_secret: loki-secret-key
  bucketnames: loki
  endpoint: http://seaweedfs.seaweedfs.svc:8333
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  ports:
  - name: s3
    port: 8333
    protocol: TCP
    targetPort: 8333
  - name: admin
    port: 9333
    protocol: TCP
    targetPort: 9333
  selector:
    app.kubernetes.io/name: seaweedfs
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: seaweedfs
  name: seaweedfs
  namespace: seaweedfs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:4.47
        command:
        - /usr/bin/weed
        - server
        - -s3
        - -s3.port=8333
        - -dir=/data
        - -master.volumeSizeLimitMB=1024
        - -volume.max=0
        env:
        - name: AWS_ACCESS_KEY_ID
          value: loki-user
        - name: AWS_SECRET_ACCESS_KEY
          value: loki-secret-key
        ports:
        - name: s3
          containerPort: 8333
        - name: master
          containerPort: 9333
        - name: volume
          containerPort: 8080
        - name: filer
          containerPort: 8888
        volumeMounts:
        - mountPath: /data
          name: storage
      volumes:
      - name: storage
        emptyDir: {}
---
# SeaweedFS does not auto-create buckets like the old MinIO mkdir trick did;
# create the Loki bucket explicitly. backoffLimit retries until the
# seaweedfs Service/pod is reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-create-bucket
  namespace: seaweedfs
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: create-bucket
        image: amazon/aws-cli:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          value: loki-user
        - name: AWS_SECRET_ACCESS_KEY
          value: loki-secret-key
        command:
        - sh
        - -c
        - aws --endpoint-url=http://seaweedfs.seaweedfs.svc:8333 s3 mb s3://loki || true
