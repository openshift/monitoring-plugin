apiVersion: project.openshift.io/v1
kind: Project
metadata:
  name: openshift-tracing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: openshift-tracing
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          command:
          - /usr/bin/weed
          - server
          - -s3
          - -s3.port=8333
          - -dir=/data
          - -master.volumeSizeLimitMB=1024
          - -volume.max=0
          env:
            - name: AWS_ACCESS_KEY_ID
              value: tempo-user
            - name: AWS_SECRET_ACCESS_KEY
              value: tempo-secret-key
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
            - name: volume
              containerPort: 8080
            - name: filer
              containerPort: 8888
          volumeMounts:
            - mountPath: /data
              name: storage
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: openshift-tracing
spec:
  ports:
    - name: s3
      port: 8333
      protocol: TCP
      targetPort: 8333
    - name: admin
      port: 9333
      protocol: TCP
      targetPort: 9333
  selector:
    app.kubernetes.io/name: seaweedfs
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
  namespace: openshift-tracing
stringData:
  endpoint: http://seaweedfs:8333
  bucket: tempo
  access_key_id: tempo-user
  access_key_secret: tempo-secret-key
type: Opaque
---
# SeaweedFS does not auto-create buckets like the old MinIO mkdir trick did;
# create the Tempo bucket explicitly. backoffLimit retries until the
# seaweedfs Service/pod is reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-create-tempo-bucket
  namespace: openshift-tracing
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-bucket
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: tempo-user
            - name: AWS_SECRET_ACCESS_KEY
              value: tempo-secret-key
          command:
            - sh
            - -c
            - aws --endpoint-url=http://seaweedfs:8333 s3 mb s3://tempo || true
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: platform
  namespace: openshift-tracing
spec:
  observability:
    metrics:
      enableMetrics: true
  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          thrift_compact:
            endpoint: 0.0.0.0:6831

    connectors:
      spanmetrics:
        metrics_flush_interval: 5s # default: 1 min
        dimensions:
        - name: k8s.namespace.name

    processors:
      k8sattributes: {}

    exporters:
      otlp:
        endpoint: tempo-platform-gateway.openshift-tracing.svc.cluster.local:8090
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: platform
      prometheus:
        endpoint: 0.0.0.0:8889
        add_metric_suffixes: false
        resource_to_telemetry_conversion:
          enabled: true # by default resource attributes are dropped

    service:
      extensions: [bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp, jaeger]
          processors: [k8sattributes]
          exporters: [otlp, spanmetrics]
        metrics:
          receivers: [spanmetrics]
          processors: []
          exporters: [prometheus]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-tracing-platform-collector
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
---
# allow platform-collector to read namespaces, pods and replicasets (required for k8sattributes processor)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-tracing-platform-collector
roleRef:
  kind: ClusterRole
  name: openshift-tracing-platform-collector
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: platform-collector
  namespace: openshift-tracing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traces-writer-platform
rules:
- apiGroups: [tempo.grafana.com]
  resources: [platform]
  resourceNames: [traces]
  verbs: [create]
---
# allow platform-collector to write traces to the 'platform' tenant in Tempo
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traces-writer-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traces-writer-platform
subjects:
- kind: ServiceAccount
  name: platform-collector
  namespace: openshift-tracing
---
apiVersion: opentelemetry.io/v1beta1
